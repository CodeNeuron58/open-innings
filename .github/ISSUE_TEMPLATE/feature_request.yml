name: Feature request
description: Something the app should do and doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
    validations:
      required: true

  - type: dropdown
    id: who
    attributes:
      label: Who it helps
      options:
        - The person scoring
        - People following the match
        - Players and their records
        - Clubs self-hosting a copy
    validations:
      required: true
